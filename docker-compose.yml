services:
  backend:
    build:
      context: ./backend
    container_name: ai_voice_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8003:8003"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: ai_voice_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_voice}
      POSTGRES_USER: ${POSTGRES_USER:-ai_voice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_voice} -d ${POSTGRES_DB:-ai_voice}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
